spring.application.name=sistema-xingu-ia
groq.api.url=https://api.groq.com/openai/v1
groq.api.key=${GROQ_API_KEY:}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sax_bd}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

solicitacao-client.api.url=http://${BACKEND_HOST:localhost}:${BACKEND_PORT:8081}

aws.region=${AWS_REGION:us-east-1}
aws.lambda.function-name=${LAMBDA_FUNCTION_NAME:salvar-solicitacao-s3}
